<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>開廷表・画像照合</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color:#17243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:17px 16px;border-bottom:1px solid #dce4ee;position:sticky;top:0;z-index:3}h1{font-size:21px;margin:0 0 6px}.sub{color:#60718a;font-size:13px}main{max-width:1150px;margin:auto;padding:16px}button,.btn{border:0;border-radius:10px;padding:12px 15px;font-size:15px;font-weight:700;background:#2563eb;color:white;cursor:pointer}button.secondary,.btn.secondary{background:#e7edf7;color:#23354d}button.warn{background:#fff0d9;color:#9b5700}button.ok{background:#def7e8;color:#12693d}button.selected{outline:3px solid #2b5caa}button:disabled{opacity:.45}input[type=file]{max-width:100%;font-size:14px}textarea,input[type=text],input[type=number]{font:inherit;border:1px solid #b9c8dc;border-radius:8px;padding:10px;width:100%;background:#fff}textarea{font-size:22px;min-height:64px;resize:vertical;line-height:1.4}.card{background:white;border:1px solid #dbe4f0;border-radius:14px;padding:15px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#65768e;font-size:13px}.progress{height:9px;background:#e0e8f3;border-radius:8px;overflow:hidden;margin-top:10px}.progress>div{background:#2674dc;height:100%;width:0}.photo{width:100%;height:auto;display:block;border-radius:8px}.photoBox{overflow:auto;max-height:520px;background:#eef1f5;border-radius:9px}.photoBox img{max-width:none;width:100%}.field{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;border-top:1px solid #edf0f5;padding:12px 0}.field:first-of-type{border-top:0}.field label{font-weight:700;padding-top:8px}.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.case{padding:12px;border:1px solid #e1e7f0;border-radius:12px;margin:12px 0}.case h3{font-size:17px;margin:0 0 9px}.split{display:grid;grid-template-columns:minmax(280px,42%) minmax(0,58%);gap:14px}.stickyPhoto{position:sticky;top:108px;align-self:start}.hidden{display:none!important}.note{line-height:1.7}code{background:#eef2f7;padding:2px 4px;border-radius:4px}.tiny{font-size:12px;color:#65768e}.count{font-size:17px;font-weight:800}#toast{position:fixed;bottom:20px;left:15px;right:15px;max-width:520px;margin:auto;padding:12px;background:#182d48;color:#fff;border-radius:12px;display:none;z-index:9}@media(max-width:720px){.split{display:block}.stickyPhoto{position:static}.photoBox{max-height:350px}.field{grid-template-columns:1fr;gap:3px}.field label{padding-top:0}textarea{font-size:23px}header{position:static}.card{padding:12px}.actions button{flex:1}}
</style></head><body><header><h1>開廷表｜画像と文字起こしの照合</h1><div class="sub">写真は端末内で読み込みます。GitHubには送信しません。</div></header><main>
<section class="card"><div class="toolbar"><label class="btn" for="photos">写真を追加</label><input id="photos" type="file" accept="image/*" multiple class="hidden"><label class="btn secondary" for="csv">文字起こしCSVを読み込む</label><input id="csv" type="file" accept=".csv,text/csv" class="hidden"><button class="secondary" id="addCase">事件を追加</button><button class="secondary" id="download">結果をCSV保存</button></div><p class="muted note">写真とCSVは同じ順番で対応します。CSVの列は <code>写真番号,C,D,E,F,G</code>（写真番号は1から）。CSVなしでも事件を手入力できます。画像はページを閉じると消えます。文字と判定はこのブラウザに一時保存されます。</p><div class="toolbar"><span id="count" class="count">0 / 0 項目確認完了</span><span id="breakdown" class="muted"></span></div><div class="progress"><div id="progress"></div></div></section>
<section class="card" id="nav" style="display:none"><div class="toolbar"><button class="secondary" id="prev">前の写真</button><strong id="pageLabel"></strong><button class="secondary" id="next">次の写真</button><button class="warn" id="rechecks">再チェックのみ表示：OFF</button><button class="secondary" id="clear">この端末の入力を消去</button></div></section>
<div id="workspace"></div><section class="card" id="empty"><h2>まず写真を追加してください</h2><p class="note">「写真を追加」から原本写真を選び、必要に応じて「文字起こしCSVを読み込む」を選択してください。初期状態では裁判資料・氏名・画像を一切含みません。</p></section>
<div id="toast" role="status"></div></main><script>
(()=>{'use strict';const KEY='court-review-private-v1';const cols=['C','D','E','F','G'],names=['審理予定','事件名','事件番号','上の人名','下の人名'];let photos=[],page=0,onlyRecheck=false;let data=[];try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved))data=saved}catch(e){};
const $=id=>document.getElementById(id);const toast=s=>{const el=$('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',3300)};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('保存容量の上限に達しました。CSVで保存してください')}};
function ensurePhoto(n){while(data.length<=n)data.push({cases:[]});if(!Array.isArray(data[n].cases))data[n].cases=[]}
function newCase(values=[]){return {values:cols.map((_,i)=>values[i]||''),status:[0,0,0,0,0]}}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stats(){let total=0,done=0,ok=0,again=0;data.forEach(p=>p.cases.forEach(c=>c.status.forEach(s=>{total++;if(s){done++;if(s===1)ok++;else again++}})));$('count').textContent=`${done} / ${total} 項目確認完了`;$('breakdown').textContent=`確認済み ${ok}・再チェック ${again}`;$('progress').style.width=(total?done/total*100:0)+'%'}
function render(){stats();const length=Math.max(photos.length,data.length);$('nav').style.display=length?'block':'none';$('empty').style.display=length?'none':'block';if(!length){$('workspace').innerHTML='';return}page=Math.max(0,Math.min(page,length-1));ensurePhoto(page);$('pageLabel').textContent=`写真 ${page+1} / ${length}｜${data[page].cases.length}事件`;$('prev').disabled=page===0;$('next').disabled=page===length-1;$('rechecks').textContent='再チェックのみ表示：'+(onlyRecheck?'ON':'OFF');const photo=photos[page];let left=`<section class="card stickyPhoto"><h2>原本写真 ${page+1}</h2>${photo?`<div class="photoBox"><img id="currentPhoto" class="photo" alt="原本写真" src="${photo.url}"></div><div class="toolbar" style="margin-top:10px"><button class="secondary" data-zoom="1.3">拡大＋</button><button class="secondary" data-zoom="0.77">縮小−</button><button class="secondary" data-zoom="reset">元の大きさ</button></div>`:'<p class="muted">この写真は未読み込みです。「写真を追加」から同じ順番で読み込んでください。</p>'}</section>`;let right=`<section class="card"><h2>文字起こし・確認</h2>`;data[page].cases.forEach((c,i)=>{if(onlyRecheck&&!c.status.includes(2))return;right+=`<div class="case"><h3>事件 ${i+1}</h3>`;cols.forEach((col,j)=>{right+=`<div class="field"><label for="f-${i}-${j}">${col}列・${names[j]}</label><div><textarea id="f-${i}-${j}" data-i="${i}" data-j="${j}">${escapeHTML(c.values[j])}</textarea><div class="actions"><button class="ok ${c.status[j]===1?'selected':''}" data-i="${i}" data-j="${j}" data-status="1">${c.status[j]===1?'✓ ':''}確認済み</button><button class="warn ${c.status[j]===2?'selected':''}" data-i="${i}" data-j="${j}" data-status="2">${c.status[j]===2?'✓ ':''}再チェック</button></div></div></div>`});right+='</div>'});right+='</section>';$('workspace').innerHTML=`<div class="split">${left}${right}</div>`;document.querySelectorAll('textarea[data-i]').forEach(el=>el.addEventListener('input',()=>{const c=data[page].cases[+el.dataset.i];c.values[+el.dataset.j]=el.value;c.status[+el.dataset.j]=0;save();stats();el.closest('.field').querySelectorAll('button').forEach(b=>{b.classList.remove('selected');b.textContent=b.dataset.status==='1'?'確認済み':'再チェック'})}));document.querySelectorAll('button[data-status]').forEach(b=>b.onclick=()=>{const c=data[page].cases[+b.dataset.i],j=+b.dataset.j,s=+b.dataset.status;c.status[j]=c.status[j]===s?0:s;save();render()});document.querySelectorAll('button[data-zoom]').forEach(b=>b.onclick=()=>{const im=$('currentPhoto');if(!im)return;let scale=+(im.dataset.scale||1);scale=b.dataset.zoom==='reset'?1:Math.max(1,Math.min(4,scale*+b.dataset.zoom));im.dataset.scale=scale;im.style.width=(scale*100)+'%'})}
$('photos').onchange=async e=>{const files=[...e.target.files];photos.forEach(p=>URL.revokeObjectURL(p.url));photos=files.map(f=>({name:f.name,url:URL.createObjectURL(f)}));photos.forEach((_,i)=>ensurePhoto(i));page=0;render();toast(`${files.length}枚の写真を読み込みました（端末内のみ）`);e.target.value=''};
function parseCSV(t){t=t.replace(/^\uFEFF/,'');let rows=[],row=[],field='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(quoted){if(c==='"'&&t[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(field);if(row.some(v=>v!==''))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(v=>v!==''))rows.push(row);return rows}
$('csv').onchange=async e=>{const file=e.target.files[0];if(!file)return;let rows=parseCSV(await file.text());if(!rows.length)return toast('CSVが空です');const h=rows[0].map(x=>x.trim()),hasHeader=h.some(x=>x==='写真番号'||x==='C'||x==='C_審理予定');if(hasHeader)rows.shift();let n=0;for(const r of rows){let photoNum=Number(r[0]);if(!Number.isInteger(photoNum)||photoNum<1){toast('写真番号は1以上の整数にしてください');return}ensurePhoto(photoNum-1);data[photoNum-1].cases.push(newCase(r.slice(1,6)));n++}save();page=0;render();toast(`${n}事件の文字起こしを読み込みました`);e.target.value=''};
$('addCase').onclick=()=>{ensurePhoto(page);data[page].cases.push(newCase());save();render()};$('prev').onclick=()=>{page--;render();scrollTo(0,0)};$('next').onclick=()=>{page++;render();scrollTo(0,0)};$('rechecks').onclick=()=>{onlyRecheck=!onlyRecheck;render()};$('clear').onclick=()=>{if(confirm('このブラウザに保存した文字と判定をすべて削除しますか？')){data=[];localStorage.removeItem(KEY);page=0;render()}};
$('download').onclick=()=>{const lines=[['写真番号','C','D','E','F','G','C_判定','D_判定','E_判定','F_判定','G_判定']];data.forEach((p,i)=>p.cases.forEach(c=>lines.push([i+1,...c.values,...c.status.map(s=>s===1?'確認済み':s===2?'再チェック':'未確認')])));const csv='\uFEFF'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='開廷表_確認結果.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
render();})();
</script></body></html>
